name: Tests

# setup-pi5.sh runs as root on other people's machines, and fetch-domains.js
# decides which domains everyone's lists get. Their tests run on every change to
# them, to the generator, or to the tests themselves; the docs test on changes
# to the docs, the issue templates, the categories in index.html or the sources
# in fetch-domains.js (each needs its terms in the README). The weekly
# list update commits with the workflow token, which starts no workflow.
on:
  push:
    branches: [main]
    paths:
      - setup-pi5.sh
      - fetch-domains.js
      - allowlist.txt
      - auto-domains.json
      - generate-lists.js
      - index.html
      - README.md
      - CONTRIBUTING.md
      - .github/ISSUE_TEMPLATE/**
      - tests/**
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - setup-pi5.sh
      - fetch-domains.js
      - allowlist.txt
      - auto-domains.json
      - generate-lists.js
      - index.html
      - README.md
      - CONTRIBUTING.md
      - .github/ISSUE_TEMPLATE/**
      - tests/**
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-pi5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # the version setup-pi5.sh installs

      - name: shellcheck
        run: shellcheck --severity=warning setup-pi5.sh tests/test-setup-pi5.sh

      - name: Tests for setup-pi5.sh
        run: bash tests/test-setup-pi5.sh

      - name: Tests for fetch-domains.js
        run: node --test tests/test-fetch-domains.js

      - name: Tests for the docs (issue templates, links, source licenses)
        run: node --test tests/test-docs.js
