name: Update Blocklists

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:       # Manual trigger via GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'   # Node 20 reached end of life on 30 April 2026

      - name: Restore ETag cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: source-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            source-cache-${{ runner.os }}-

      - name: Fetch new domains from external sources
        # Run --cleanup on the first Monday of each month (day 1-7) to remove dead domains.
        # Failed sources are skipped and written to FAILED_SOURCES_FILE (empty: all fine).
        env:
          FAILED_SOURCES_FILE: ${{ runner.temp }}/failed-sources.txt
        run: |
          DAY=$(date +%d)
          if [ "$DAY" -le 7 ]; then
            echo "First Monday of month — running with --cleanup"
            node fetch-domains.js --cleanup
          else
            node fetch-domains.js
          fi

      - name: Generate blocklist files
        run: node generate-lists.js

      - name: Commit updated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html lists/
          git diff --staged --quiet || git commit -m "chore: auto-update blocklists [$(date -u +%Y-%m-%d)]"
          git push

      # The lists above were built and pushed from the sources that worked. A red
      # run is what makes GitHub send an e-mail; a skipped source alone went
      # unnoticed for months (Hagezi 404 from Aug 2026, URLhaus 410 from Oct 2026).
      # A missing status file means the fetch step did not report: also red.
      - name: Fail if a source is down
        env:
          FAILED_SOURCES_FILE: ${{ runner.temp }}/failed-sources.txt
        run: |
          if [ ! -f "$FAILED_SOURCES_FILE" ]; then
            echo "::error title=No source status::fetch-domains.js wrote no status file"
            exit 1
          fi
          if [ -s "$FAILED_SOURCES_FILE" ]; then
            while IFS= read -r line; do echo "::error title=Source problem::$line"; done < "$FAILED_SOURCES_FILE"
            exit 1
          fi
          echo "All sources delivered."
