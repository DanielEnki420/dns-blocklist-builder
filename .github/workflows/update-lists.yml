name: Update Blocklists

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:       # Manual trigger via GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore ETag cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: source-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            source-cache-${{ runner.os }}-

      - name: Fetch new domains from external sources
        # Run --cleanup on the first Monday of each month (day 1-7) to remove dead domains
        run: |
          DAY=$(date +%d)
          if [ "$DAY" -le 7 ]; then
            echo "First Monday of month — running with --cleanup"
            node fetch-domains.js --cleanup
          else
            node fetch-domains.js
          fi

      - name: Generate blocklist files
        run: node generate-lists.js

      - name: Commit updated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html lists/
          git diff --staged --quiet || git commit -m "chore: auto-update blocklists [$(date -u +%Y-%m-%d)]"
          git push
